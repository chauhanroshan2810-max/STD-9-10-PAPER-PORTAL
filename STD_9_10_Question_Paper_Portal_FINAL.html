<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STD 9-10 Question Paper Portal</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6fa;color:#172033}header{background:#173b72;color:#fff;padding:15px;text-align:center}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;margin:12px 0;padding:15px;border-radius:12px;box-shadow:0 2px 10px #0001}button,.file{background:#1769aa;color:#fff;border:0;border-radius:8px;padding:10px 14px;margin:3px;cursor:pointer}.ok{background:#16834b}.file{display:inline-block}.file input{display:none}.row{display:flex;flex-wrap:wrap;gap:6px}input,textarea{padding:9px;border:1px solid #ccd4e0;border-radius:7px;font:inherit}textarea{width:100%;margin-top:8px}.status{background:#eef4ff;padding:10px;border-radius:8px;white-space:pre-wrap}.q{display:flex;gap:10px;border:1px solid #d7dee8;border-radius:9px;padding:12px;margin:8px 0}.qtext,.paperq{white-space:pre-wrap;line-height:1.55}.qtext{flex:1}.section{border:1px solid #ccd5e2;padding:12px;border-radius:10px;margin:12px 0}.instruction{background:#fff8df;border-left:4px solid #e1a500;padding:10px;white-space:pre-wrap}@media print{.no-print{display:none!important}.card{box-shadow:none}}</style></head><body>
<header><h2>STD 9-10 પ્રશ્નપત્ર પોર્ટલ</h2></header><div class="wrap">
<div class="card no-print"><h3>1. Marks / Section</h3><div id="marks" class="row"></div><div class="row"><input id="newMark" type="number" min="1" placeholder="નવા marks"><button onclick="addMark()">+ Marks Section</button></div><div id="sectionForm"></div></div>
<div class="card no-print"><h3>2. PDFમાંથી પ્રશ્નો લાવો</h3><label class="file">📄 PDF ના પ્રશ્નો લાવો <input id="pdf" type="file" accept=".pdf,application/pdf"></label><label class="file">📷 Scan PDF OCR <input id="ocr" type="file" accept=".pdf,application/pdf"></label><button onclick="clearQuestions()">Clear</button><div id="status" class="status">PDF પસંદ કરો.</div><small>OCR માટે Internet ચાલુ હોવું જરૂરી છે.</small></div>
<div class="card no-print"><h3>3. મળેલા પ્રશ્નો</h3><div id="questions">હજુ પ્રશ્નો નથી.</div><button class="ok" onclick="addSelected()">✓ Selected પ્રશ્નો Sectionમાં ઉમેરો</button><button onclick="selectAll(true)">બધા Select</button><button onclick="selectAll(false)">બધા Unselect</button></div>
<div class="card"><h3>4. તૈયાર પ્રશ્નપત્ર</h3><div id="paper">હજુ પ્રશ્નો ઉમેરાયા નથી.</div><button class="ok no-print" onclick="window.print()">🖨️ Print / Save PDF</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";let marks=[1,2,3,4],active=1,questions=[],sections={};const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function status(s){$('status').textContent=s}
function renderMarks(){$('marks').innerHTML=marks.map(m=>`<button class="${m===active?'ok':''}" onclick="active=${m};renderMarks()">${m} માર્ક</button>`).join('');let s=sections[active]||{name:'વિભાગ ('+active+' માર્ક)',instruction:''};$('sectionForm').innerHTML=`<input id="secName" value="${esc(s.name)}" style="width:60%" placeholder="Section name"><textarea id="secIns" rows="3" placeholder="આ Sectionની સૂચના">${esc(s.instruction)}</textarea><button onclick="saveSection()">Section Save</button>`;renderPaper()}
function saveSection(){let o=sections[active]||{};sections[active]={name:$('secName').value||'વિભાગ ('+active+' માર્ક)',instruction:$('secIns').value||'',questions:o.questions||[]};renderPaper()}
function addMark(){let n=+$('newMark').value;if(n&&!marks.includes(n)){marks.push(n);marks.sort((a,b)=>a-b);active=n;$('newMark').value='';renderMarks()}}
$('pdf').onchange=e=>{let f=e.target.files[0];if(f)readPDF(f,false);e.target.value=''};$('ocr').onchange=e=>{let f=e.target.files[0];if(f)readPDF(f,true);e.target.value=''};
async function loadTesseract(){if(window.Tesseract)return;await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>reject(Error('Tesseract load થયું નથી. Internet તપાસો.'));document.head.appendChild(s)})}
async function readPDF(file,ocr){try{questions=[];renderQuestions();status((ocr?'OCR':'PDF')+' શરૂ...');let pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;if(ocr)await loadTesseract();let text='';for(let p=1;p<=pdf.numPages;p++){status((ocr?'OCR':'PDF')+' page '+p+'/'+pdf.numPages+'...');let page=await pdf.getPage(p);if(!ocr){let tc=await page.getTextContent();text+=tc.items.map(x=>x.str).join(' ')+'\n'}else{let v=page.getViewport({scale:2}),c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);await page.render({canvasContext:ctx,viewport:v}).promise;let r=await Tesseract.recognize(c,'eng+guj',{logger:m=>{if(m.progress)status('OCR page '+p+'/'+pdf.numPages+': '+m.status+' '+Math.round(m.progress*100)+'%')}});text+=r.data.text+'\n'}}questions=parseQuestions(text);renderQuestions();status((ocr?'OCR':'PDF')+' પૂર્ણ. '+questions.length+' પ્રશ્ન મળ્યા.')}catch(e){console.error(e);status('Error: '+e.message)}}
function parseQuestions(raw){raw=raw.replace(/\r/g,'\n').replace(/\u00a0/g,' ').replace(/[ \t]+\n/g,'\n').trim();let lines=raw.split('\n').map(x=>x.trim()).filter(Boolean),re=/^(?:પ્રશ્ન\s*)?(?:Q(?:uestion)?\.?\s*)?(\d{1,3})\s*[\.\):\-]/i,idx=[];lines.forEach((x,i)=>{if(re.test(x))idx.push(i)});let out=[];for(let j=0;j<idx.length;j++){let b=lines.slice(idx[j],idx[j+1]??lines.length).join('\n').trim();if(!/^(સૂચના|સૂચનાઓ|નોંધ|instruction|instructions)\b/i.test(b))out.push({text:b})}if(!out.length)out=raw.split(/\n\s*\n/).map(x=>x.trim()).filter(x=>x&&!/^(સૂચના|સૂચનાઓ|નોંધ|instruction|instructions)\b/i.test(x)).map(x=>({text:x}));return out}
function renderQuestions(){if(!questions.length){$('questions').innerHTML='કોઈ પ્રશ્ન મળ્યો નથી.';return}$('questions').innerHTML=questions.map((q,i)=>`<div class="q"><input type="checkbox" class="qc" data-i="${i}"><div class="qtext">${esc(q.text)}</div></div>`).join('')}
function selectAll(v){document.querySelectorAll('.qc').forEach(x=>x.checked=v)}
function addSelected(){let a=[...document.querySelectorAll('.qc')].filter(x=>x.checked).map(x=>questions[+x.dataset.i]);if(!a.length){alert('પહેલા પ્રશ્ન select કરો.');return}if(!sections[active])sections[active]={name:'વિભાગ ('+active+' માર્ક)',instruction:'',questions:[]};sections[active].questions.push(...a);renderPaper();status(a.length+' પ્રશ્ન Sectionમાં ઉમેરાયા.')}
function renderPaper(){let ks=Object.keys(sections).map(Number).sort((a,b)=>a-b);if(!ks.length){$('paper').innerHTML='હજુ પ્રશ્નો ઉમેરાયા નથી.';return}$('paper').innerHTML=ks.map(m=>{let s=sections[m];return `<div class="section"><h3>${esc(s.name)} — ${m} માર્ક</h3>${s.instruction?`<div class="instruction"><b>સૂચના:</b><br>${esc(s.instruction)}</div>`:''}${(s.questions||[]).map((q,i)=>`<div class="paperq"><b>પ્રશ્ન ${i+1}.</b> ${esc(q.text)}</div>`).join('')}</div>`}).join('')}
function clearQuestions(){questions=[];renderQuestions();status('પ્રશ્નો clear થયા.')}renderMarks();
</script></body></html>
