<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STD 9-10 Paper Portal</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Gujarati",sans-serif;background:#f3f5f7;color:#222}header{background:#173b68;color:#fff;padding:15px;font-size:22px;font-weight:700}.layout{display:flex;min-height:calc(100vh - 56px)}aside{width:245px;background:#fff;padding:12px;border-right:1px solid #ddd}main{flex:1;padding:14px;max-width:1100px;margin:auto}.card,.section{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;margin-bottom:14px}button{border:0;border-radius:7px;padding:9px 12px;background:#173b68;color:#fff;cursor:pointer}button.red{background:#c62828}.marks button{display:flex;width:100%;justify-content:space-between;margin:6px 0;background:#edf2f8;color:#173b68}.marks button.active{background:#173b68;color:#fff}input,textarea{width:100%;padding:9px;border:1px solid #c8ced7;border-radius:6px;font-size:15px}textarea{min-height:65px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-weight:bold;font-size:14px;display:block;margin-bottom:5px}.q{display:flex;gap:9px;border:1px solid #ddd;border-radius:8px;padding:9px;margin:7px 0}.q input{width:20px}.qtext{white-space:pre-wrap;line-height:1.5;flex:1}.instruction{background:#f5f6f8;border-left:4px solid #173b68;padding:9px;white-space:pre-wrap}.preview{background:#fff;padding:25px;max-width:800px;margin:auto}.paperq{padding:8px 0;border-bottom:1px dashed #aaa;white-space:pre-wrap;line-height:1.55}.center{text-align:center}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:13px;color:#667085}@media(max-width:700px){.layout{display:block}aside{width:100%;border-right:0;border-bottom:1px solid #ddd}.grid,.grid3{grid-template-columns:1fr}}@media print{header,aside,.no-print{display:none!important}main{padding:0}.preview{max-width:none}}
</style></head><body><header>STD 9-10 Paper Portal</header><div class="layout"><aside><h3>વિભાગ / ગુણ</h3><div id="marks" class="marks"></div><div class="card"><label>નવો ગુણ</label><input id="newmark" type="number" min="1" placeholder="5"><button onclick="addMark()" style="margin-top:6px">ઉમેરો</button></div><button onclick="addSection()">+ નવો વિભાગ</button></aside><main>
<div class="card"><h2>Paper Settings</h2><div class="grid"><div><label>પેપરનું નામ</label><input id="title" placeholder="પ્રશ્નપત્ર"></div><div><label>વિષય</label><input id="subject"></div><div><label>ધોરણ</label><input id="standard"></div><div><label>સમય</label><input id="time"></div></div></div>
<div class="card no-print"><h2>📄 પ્રશ્નપત્ર Upload કરો</h2>
<div class="actions">
<button type="button" onclick="document.getElementById("pdf").click()">📄 PDF Upload કરો</button>
<button type="button" onclick="document.getElementById("scan").click()">📷 Scan PDF Upload કરો</button>
</div>
<input id="pdf" type="file" accept=".pdf,application/pdf" style="display:none">
<input id="scan" type="file" accept=".pdf,image/*" style="display:none">
<p id="status" class="small">ઉપરથી સામાન્ય PDF અથવા Scan PDF અલગથી પસંદ કરો.</p></div>
<div class="card no-print"><h2>પ્રશ્ન પસંદ કરો</h2><p id="info" class="small"></p><div id="questions"></div><div class="actions"><button onclick="addSelected()">✓ પસંદ પ્રશ્નો વિભાગમાં ઉમેરો</button><button onclick="manual()">+ પ્રશ્ન જાતે ઉમેરો</button></div></div>
<div class="card no-print"><h2>વિભાગો</h2><div id="sections"></div></div>
<div class="card no-print actions"><button onclick="preview()">પેપર Preview</button><button onclick="window.print()">Print / Save PDF</button></div><div id="preview"></div>
</main></div><script>
const S={marks:[1,2,3,4],active:1,qs:[],secs:[]};
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
function render(){renderMarks();renderQs();renderSecs()}
function renderMarks(){marks.innerHTML='';S.marks.forEach(m=>{let b=document.createElement('button');b.className=S.active==m?'active':'';b.innerHTML='<span>'+m+' ગુણ વિભાગ</span><b>'+m+'</b>';b.onclick=()=>{S.active=m;render()};marks.appendChild(b)})}
function addMark(){let m=+newmark.value;if(m>0&&!S.marks.includes(m)){S.marks.push(m);S.marks.sort((a,b)=>a-b)}if(m>0)S.active=m;newmark.value='';render()}
function addSection(mark=S.active){S.secs.push({name:'વિભાગ '+(S.secs.length+1),mark:+mark||1,instruction:'',qs:[]});renderSecs()}
function renderQs(){questions.innerHTML='';info.textContent='હાલ '+S.active+' ગુણ વિભાગ. પ્રશ્નની બાજુમાં ગુણ દેખાશે નહીં.';let a=S.qs.filter(q=>q.mark==S.active);if(!a.length){questions.innerHTML='<p class="small">પ્રશ્ન નથી. “પ્રશ્ન જાતે ઉમેરો” દબાવો.</p>';return}a.forEach(q=>{let d=document.createElement('div');d.className='q';d.innerHTML='<input type="checkbox" data-id="'+q.id+'"><div class="qtext">'+esc(q.text)+'</div>';questions.appendChild(d)})}
function manual(){let t=prompt('પ્રશ્ન લખો:');if(t){S.qs.push({id:id(),mark:S.active,text:t});renderQs()}}
function addSelected(){let ids=[...document.querySelectorAll('#questions input:checked')].map(x=>x.dataset.id);if(!ids.length)return alert('પ્રશ્ન પસંદ કરો.');let sec=S.secs.find(x=>x.mark==S.active);if(!sec){sec={name:'વિભાગ '+(S.secs.length+1),mark:S.active,instruction:'',qs:[]};S.secs.push(sec)}ids.forEach(i=>{let q=S.qs.find(x=>x.id==i);if(q&&!sec.qs.some(x=>x.id==i))sec.qs.push(q)});renderSecs()}
function renderSecs(){sections.innerHTML='';S.secs.forEach((s,i)=>{let d=document.createElement('div');d.className='section';d.innerHTML='<div class="grid3"><div><label>વિભાગનું નામ</label><input value="'+esc(s.name)+'" oninput="S.secs['+i+'].name=this.value"></div><div><label>દરેક પ્રશ્નના ગુણ</label><input type="number" min="1" value="'+s.mark+'" oninput="S.secs['+i+'].mark=+this.value||1"></div><div><label>પ્રશ્નોની સંખ્યા</label><input readonly value="'+s.qs.length+'"></div></div><label style="margin-top:10px">આ વિભાગની સૂચના</label><textarea oninput="S.secs['+i+'].instruction=this.value" placeholder="સૂચના અહીં લખો...">'+esc(s.instruction)+'</textarea><div id="sq'+i+'"></div><button class="red" onclick="S.secs.splice('+i+',1);renderSecs()" style="margin-top:8px">વિભાગ કાઢો</button>';sections.appendChild(d);let box=d.querySelector('#sq'+i);s.qs.forEach((q,j)=>{let p=document.createElement('div');p.className='q';p.innerHTML='<div class="qtext">'+esc(q.text)+'</div><button class="red" onclick="S.secs['+i+'].qs.splice('+j+',1);renderSecs()">×</button>';box.appendChild(p)})})}
function esc(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function preview(){let h='<div class="preview"><div class="center"><h2>'+esc(title.value||'પ્રશ્નપત્ર')+'</h2><p>'+esc(standard.value)+' | '+esc(subject.value)+' | '+esc(time.value)+'</p></div>';S.secs.forEach((s,i)=>{h+='<div class="section"><h3>વિભાગ '+(i+1)+' : '+esc(s.name)+'</h3>';if(s.instruction.trim())h+='<div class="instruction"><b>સૂચના:</b><br>'+esc(s.instruction)+'</div>';s.qs.forEach((q,j)=>h+='<div class="paperq">'+(j+1)+'. '+esc(q.text)+'</div>');h+='</div>'});h+='</div>';preview.innerHTML=h}
pdf.onchange=e=>{if(e.target.files[0])status.textContent='📄 PDF Upload થયું: '+e.target.files[0].name+' — હવે પ્રશ્નો પસંદ/edit કરી શકો છો.'}
scan.onchange=e=>{if(e.target.files[0])status.textContent='📷 Scan PDF Upload થયું: '+e.target.files[0].name+' — Scan પ્રશ્નો માટે OCR પ્રક્રિયા જરૂરી છે.'}
[1,2,3,4].forEach(m=>S.secs.push({name:'વિભાગ '+m,mark:m,instruction:'',qs:[]}));render();
</script></body></html>
