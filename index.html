function key(type,i){return type+':'+i}
function renderBank(){
  const g=QB.social.groups; let html='';
  const sections=[['matching',g.A.matching],['fill',g.A.fill],['short',g.A.short],['tf',g.A.tf],['B',g.B],['C',g.C],['D',g.D]];
  sections.forEach(([type,arr])=>{
    html+=`<div class="bank-section"><h3>${labels[type]} <span class="selected-tag">(પસંદ: ${countType(type)}/${limits[type]})</span></h3>`;
    arr.forEach((q,i)=>{
      const text=type==='matching'?`${q[0]} — ${q[1]}`:q;
      const k=key(type,i); const checked=selected.has(k)?'checked':'';
      html+=`<div class="bank-item"><label><input type="checkbox" data-type="${type}" data-index="${i}" ${checked}> <span><b>${i+1}.</b> ${text}</span></label></div>`;
    });
    html+='</div>';
  });
  $('bankList').innerHTML=html; updateCount();
  $('bankList').querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',()=>toggleSelection(cb)));
}
function countType(type){let n=0;selected.forEach(k=>{if(k.startsWith(type+':'))n++});return n}
function updateCount(){
  const total=selected.size; $('selectedCount').textContent=`પસંદગી: ${total} | A: ${countType('matching')}/${limits.matching}, ${countType('fill')}/${limits.fill}, ${countType('short')}/${limits.short}, ${countType('tf')}/${limits.tf} | B: ${countType('B')}/${limits.B} | C: ${countType('C')}/${limits.C} | D: ${countType('D')}/${limits.D}`;
  document.querySelectorAll('.bank-section').forEach(sec=>{const h=sec.querySelector('h3'); const tag=h&&h.querySelector('.selected-tag'); if(tag){const type=[...Object.entries(labels)].find(([,v])=>h.textContent.includes(v))?.[0]; if(type)tag.textContent=`(પસંદ: ${countType(type)}/${limits[type]})`}});
}
function toggleSelection(cb){
  const type=cb.dataset.type, i=Number(cb.dataset.index), k=key(type,i);
  if(cb.checked){ if(countType(type)>=limits[type]){cb.checked=false; alert(`${labels[type]} માં મહત્તમ ${limits[type]} પ્રશ્ન પસંદ કરી શકાય છે.`); return;} selected.add(k); } else selected.delete(k);
  updateCount();
}
function getSelected(type,arr){return [...arr].filter((_,i)=>selected.has(key(type,i)))}
function selectionValid(){return Object.entries(limits).every(([t,n])=>countType(t)===n)}
function buildPaper(data){
  const {matching,fill,short,tf,B,C,D}=data; let html=`<h2>ગુજરાત માધ્યમિક અને ઉચ્ચતર માધ્યમિક શિક્ષણ બોર્ડ</h2><div class="meta"><div><b>ધોરણ:</b> 10</div><div><b>વિષય:</b> ${QB.social.title}</div><div><b>શાળા:</b> ${$('school').value||'________________'}</div><div><b>વિદ્યાર્થી:</b> ${$('student').value||'________________'}</div><div><b>તારીખ:</b> ${$('date').value||'__________'}</div><div><b>કુલ ગુણ:</b> 25</div></div>`;
  html+=`<div class="section"><h3>વિભાગ – A <span class="marks">[6]</span></h3><p><b>1.</b> યોગ્ય જોડકાં જોડો (કોઈપણ બે) [2]</p><div class="options">${matching.map((x,k)=>`${k+1}. ${x[0]} — ${x[1]}`).join('<br>')}</div><p><b>2.</b> ખાલી જગ્યા પૂરો (કોઈપણ એક) [1]</p><div class="q">${fill[0]}</div><p><b>3.</b> નીચેના પ્રશ્નોના એક–બે વાક્યમાં જવાબ આપો (કોઈપણ બે) [2]</p>${short.map((x,k)=>`<div class="q">(${k+1}) ${x}</div>`).join('')}<p><b>4.</b> ખરાં–ખોટાં વિધાનો ઓળખી બતાવો (કોઈપણ એક) [1]</p>${tf.map((x,k)=>`<div class="q">(${k+1}) ${x}</div>`).join('')}</div>`;
  html+=`<div class="section"><h3>વિભાગ – B <span class="marks">[6]</span></h3><p>કોઈપણ ત્રણ પ્રશ્નોના આશરે 15 થી 35 શબ્દોમાં જવાબ આપો. (દરેકના બે ગુણ)</p>${B.map((x,k)=>`<div class="q"><b>${k+1}.</b> ${x}</div>`).join('')}</div>`;
  html+=`<div class="section"><h3>વિભાગ – C <span class="marks">[9]</span></h3><p>કોઈપણ ત્રણ પ્રશ્નોના આશરે 60 થી 80 શબ્દોમાં મુદ્દાસર જવાબ લખો. (દરેકના ત્રણ ગુણ)</p>${C.map((x,k)=>`<div class="q"><b>${k+1}.</b> ${x}</div>`).join('')}</div>`;
  html+=`<div class="section"><h3>વિભાગ – D <span class="marks">[4]</span></h3><p>કોઈ એક પ્રશ્નનો જવાબ આશરે 120 થી 150 શબ્દોમાં લખો.</p>${D.map((x,k)=>`<div class="q"><b>${k+1}.</b> ${x}</div>`).join('')}</div><div class="footer">પ્રશ્નો: અપલોડ કરાયેલ GSEB ધોરણ-10 સામાજિક વિજ્ઞાન પ્રથમ સત્ર પ્રશ્નબેંક 2026 પરથી • 25 ગુણનું પેપર</div>`;
  $('paper').classList.remove('empty'); $('paper').innerHTML=html; window.scrollTo({top:$('paper').offsetTop-10,behavior:'smooth'});
}
function renderSelected(){
  if(!selectionValid()){alert('કૃપા કરીને દરેક વિભાગમાંથી જરૂરી સંખ્યામાં પ્રશ્નો પસંદ કરો.'); return;}
  const g=QB.social.groups; buildPaper({matching:getSelected('matching',g.A.matching),fill:getSelected('fill',g.A.fill),short:getSelected('short',g.A.short),tf:getSelected('tf',g.A.tf),B:getSelected('B',g.B),C:getSelected('C',g.C),D:getSelected('D',g.D)});
}
function renderRandom(){
  const g=QB.social.groups; selected.clear();
  [['matching',g.A.matching],['fill',g.A.fill],['short',g.A.short],['tf',g.A.tf],['B',g.B],['C',g.C],['D',g.D]].forEach(([t,a])=>pick(a,limits[t]).forEach(q=>{const i=a.indexOf(q);selected.add(key(t,i))}));
  buildPaper({matching:pick(g.A.matching,2),fill:pick(g.A.fill,1),short:pick(g.A.short,2),tf:pick(g.A.tf,1),B:pick(g.B,3),C:pick(g.C,3),D:pick(g.D,1)});
}
$('showBank').onclick=()=>{$('bank').hidden=false;renderBank();$('bank').scrollIntoView({behavior:'smooth'});};
$('closeBank').onclick=()=>{$('bank').hidden=true};
$('selectNone').onclick=()=>{selected.clear();renderBank()};
$('generate').onclick=renderSelected;
$('randomGenerate').onclick=renderRandom;
$('print').onclick=()=>{if($('paper').classList.contains('empty')){alert('પહેલા પેપર બનાવો.');return}setTimeout(()=>window.print(),100)};
$('date').value=new Date().toISOString().slice(0,10);

</script></body></html>
